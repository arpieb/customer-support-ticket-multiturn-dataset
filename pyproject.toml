[project]
name = "customer-support-ticket-multiturn-dataset"
version = "0.1.0"
description = "Reproducible generator for multi-turn customer support ticket datasets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2,<3",
    "datafog>=4.8,<5",
    "typer>=0.12",
    "litellm>=1.97.0",
]

[project.scripts]
ticket-dataset = "ticket_dataset.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_dataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
