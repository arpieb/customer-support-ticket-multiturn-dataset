# Generating against a remotely hosted Ollama server.
#
# litellm reaches Ollama over HTTP, so nothing here is special-cased in this project: the model
# string names the provider and `extra` carries whatever that provider needs. `api_base` is the
# one setting a remote host requires — without it litellm assumes http://localhost:11434.
#
# Use `ollama_chat/` rather than `ollama/`: the chat endpoint honours the system message this
# pipeline relies on for its cache-stable prompt prefix, and supports the structured-output
# `format` parameter that FR-009b's validation is built around (Ollama >= 0.5).
record_count = 20
output_path = "data/release/ollama-smoke.jsonl"
composition_tolerance_pp = 10.0

# Self-hosted models are typically slower per call and have no provider-side rate limit worth
# respecting — the bound that matters is your own server's concurrency.
max_concurrency = 2
requests_per_minute = 120

# The 0.5% default assumes a model that follows the prompt document almost always. A smaller model
# does not: a 20-record run against gpt-oss:20b complied 22 times out of 25 and invented a
# realistic-looking domain three times, which is 12% and fails the default outright.
#
# Raising this weakens an alarm, not the gate (FR-021d). Every one of those records is still
# blocked and still quarantined; what a higher threshold concedes is that this model's
# instruction-following is imperfect and you have accepted that. Lower it toward 0.5% as prompt
# steering improves, and treat a sudden rise as the signal it is meant to be.
[privacy]
max_discard_rate = 0.05

[turns]
min = 4
max = 8

[models.generator]
model_id = "ollama_chat/llama3.1"
max_tokens = 4096

[models.generator.extra]
api_base = "http://ollama.internal:11434"

[models.judge]
model_id = "ollama_chat/llama3.1"
max_tokens = 2048

[models.judge.extra]
api_base = "http://ollama.internal:11434"

# 20 records cannot represent the default distribution's smallest shares, so the mix is flattened
# to members that round to at least one record (FR-032).
[composition.category]
billing = 0.5
technical = 0.5

[composition.priority]
normal = 1.0

[composition.channel]
email = 0.5
chat = 0.5

[composition.resolution_status]
resolved = 0.75
escalated = 0.25
